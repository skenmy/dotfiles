name: docs

# Builds the audit site from the repository sources and publishes it to
# GitHub Pages. Runs on every push to main (including the nightly brew-sync
# commits) so the generated inventory can never go stale. Pull requests get
# a build-only check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit-test the inventory parsers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate inventory pages
        run: PYTHONPATH=scripts python3 -m docsgen
      - name: Build site
        run: |
          pip install --quiet "mkdocs-material<10"
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement=true asks GitHub to switch Pages on (source = Actions) if
      # it isn't already. Fallback: Settings → Pages → Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
