# ---- Prefix ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- General ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"
set -g mouse on
set -g history-limit 1000000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g escape-time 10
set -g status-interval 5
set -g set-clipboard on
setw -g mode-keys vi

# ---- Splits with intuitive bindings ----
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- vim-style pane navigation ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Resize panes ----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Reload config ----
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---- Copy mode (vi) ----
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard"
bind -T copy-mode-vi r send -X rectangle-toggle

# ---- Status line ----
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=green,bold] #S #[default]| "
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M #[fg=green]#h"
setw -g window-status-current-style "fg=black,bg=cyan,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# ---- TPM (tmux plugin manager) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Bootstrap TPM if missing
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
