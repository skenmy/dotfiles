# skenmy default pre-commit config — copy into a project as
# `.pre-commit-config.yaml` and run `pre-commit install` to enable.
#
# Each repo can add language-specific hooks below (ruff/eslint/gofumpt/etc.).
# This file only ships the language-agnostic safety net.
# Refresh the pinned revs with: pre-commit autoupdate -c ~/.config/pre-commit/skenmy-defaults.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks         # blocks commits containing API keys, tokens, etc.

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell        # typo finder; allow per-project via .codespellrc
        # Quoted on purpose: an unquoted [a,b] is a YAML list, so only the first
        # word was ever ignored and the rest were passed as file paths.
        args: ["--ignore-words-list=crate,hist"]
