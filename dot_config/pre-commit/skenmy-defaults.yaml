# skenmy default pre-commit config — copy into a project as
# `.pre-commit-config.yaml` and run `pre-commit install` to enable.
#
# Each repo can add language-specific hooks below (ruff/eslint/gofumpt/etc.).
# This file only ships the language-agnostic safety net.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks         # blocks commits containing API keys, tokens, etc.

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell        # typo finder; allow per-project via .codespellrc
        args: [--ignore-words-list=crate,hist]
